name: Update Major Version
run-name: Update ${{ github.event.inputs.main_version }} to ${{ github.event.inputs.target }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: The target tag or reference
        required: true
      main_version:
        type: choice
        description: The major version tag to update
        options:
          - v7
          - v8

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ secrets.ACTIONS_BOT_TOKEN }}
        fetch-depth: 0
    - name: Git config
      run: |
        git config user.name actions-bot
        git config user.email actions-bot@users.noreply.github.com
    - name: Tag new target
      run: git tag -f "${INPUT_MAIN_VERSION}" "${INPUT_TARGET}"
      env:
        INPUT_MAIN_VERSION: ${{ github.event.inputs.main_version }}
        INPUT_TARGET: ${{ github.event.inputs.target }}
    - name: Push new tag
      run: git push origin "${INPUT_MAIN_VERSION}" --force
      env:
        INPUT_MAIN_VERSION: ${{ github.event.inputs.main_version }}
